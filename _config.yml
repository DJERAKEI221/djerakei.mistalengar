# Site settings
title: "Djerakeï Mistalengar - Portfolio"
description: "Portfolio GitHub de Djerakeï Mistalengar - Élève Ingénieur Statisticien Économiste (ISE)"
author: "Djerakeï Mistalengar"
email: "yvesdjerake@gmail.com"

# GitHub Pages settings
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
